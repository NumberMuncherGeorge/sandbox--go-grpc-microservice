version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: rating-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rating_service

  rating-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rating-service
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      - GRPC_PORT=50051
      - HTTP_PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=rating_service
    depends_on:
      - mongodb

volumes:
  mongodb_data:
