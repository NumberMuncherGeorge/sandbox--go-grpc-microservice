run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
  
  govet:
    enable-all: true
  
  revive:
    rules:
      - name: exported
        severity: warning
      - name: error-return
      - name: error-naming
      - name: blank-imports
      - name: var-declaration
      - name: package-comments
      - name: indent-error-flow
      - name: receiver-naming
      - name: increment-decrement
      - name: range
      - name: errorf
      - name: context-as-argument
      - name: context-keys-type
  
  goimports:
    local-prefixes: github.com/NumberMuncherGeorge/sandbox--go-grpc-microservice

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: internal/pb/
      linters:
        - all
  max-same-issues: 0
  max-issues-per-linter: 0
