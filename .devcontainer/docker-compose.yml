version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ../:/workspace:cached
      - go-modules:/go/pkg/mod
    command: sleep infinity
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=airplane_rating
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=airplane_rating
    networks:
      - app-network

volumes:
  mongodb-data:
  mongodb-config:
  go-modules:


networks:
  app-network:
    driver: bridge
