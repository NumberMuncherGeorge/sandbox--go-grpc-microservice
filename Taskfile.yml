version: '3'

vars:
  PROTO_DIR: ./proto
  PROTO_OUT_DIR: ./internal/pb
  PROTO_DEPS_DIR: ./third_party/googleapis
  BIN_DIR: ./bin
  SERVER_BINARY: airplane-rating-server

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  init:
    desc: Initialize Go module and install dependencies
    cmds:
      - go mod init github.com/NumberMuncherGeorge/sandbox--go-grpc-microservice || true
      - go mod tidy

  install-tools:
    desc: Install required Go tools for development
    cmds:
      - go install tool

  proto:
    desc: Generate Go code from proto files
    deps: [proto-deps, clean-proto]
    cmds:
      - mkdir -p {{.PROTO_OUT_DIR}}
      - |
        protoc \
          --proto_path={{.PROTO_DIR}} \
          --proto_path={{.PROTO_DEPS_DIR}} \
          --go_out={{.PROTO_OUT_DIR}} \
          --go_opt=paths=source_relative \
          --go-grpc_out={{.PROTO_OUT_DIR}} \
          --go-grpc_opt=paths=source_relative \
          --grpc-gateway_out={{.PROTO_OUT_DIR}} \
          --grpc-gateway_opt=paths=source_relative \
          --grpc-gateway_opt=generate_unbound_methods=true \
          {{.PROTO_DIR}}/**/**/*.proto
    sources:
      - "{{.PROTO_DIR}}/**/*.proto"
    generates:
      - "{{.PROTO_OUT_DIR}}/**/*.pb.go"

  proto-deps:
    desc: Download protocol buffer dependencies (googleapis)
    cmds:
      - ./scripts/download-proto-deps.sh
    status:
      - test -d {{.PROTO_DEPS_DIR}}

  clean-proto:
    desc: Clean generated proto files
    cmds:
      - rm -rf {{.PROTO_OUT_DIR}}

  build:
    desc: Build the server binary
    deps: [proto]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.SERVER_BINARY}} ./cmd/server
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - "{{.BIN_DIR}}/{{.SERVER_BINARY}}"

  run:
    desc: Run the server locally
    deps: [build]
    cmds:
      - "{{.BIN_DIR}}/{{.SERVER_BINARY}}"

  test:
    desc: Run all tests
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...
      - gofmt -s -w .

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf {{.PROTO_OUT_DIR}}
      - rm -f coverage.out coverage.html

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t airplane-rating-service:latest .

  ci:
    desc: Run CI checks (lint, test, build)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build
